<text x="760.0" y="174" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">a review</text>
<rect x="834" y="64" width="76" height="76" rx="10" fill="#2b2d30"/>
<g transform="translate(859.0 78.0) scale(1.0833333333333333)" fill="none" stroke="#82aaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M7 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M7 8l0 8"/><path d="M7 8a4 4 0 0 0 4 4h4"/></g>
<text x="872.0" y="128" text-anchor="middle" font-size="9.5" fill="#ebf0ec">ready</text>
