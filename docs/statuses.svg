<text x="872.0" y="174" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">yours to merge</text>
<text x="20" y="210" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Each status has its own icon and colour. The agent wins while it asks or works; after that the pull request speaks.</text>
