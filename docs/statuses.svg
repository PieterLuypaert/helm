<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 946 224" width="946" height="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>What a key can say</title>
