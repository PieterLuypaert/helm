<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 350" width="992" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Answering a question</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<rect x="20" y="64" width="380" height="226" rx="8" fill="#16181c"/>
<text x="34" y="90" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">Bash command</text>
<text x="34" y="114" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#afb6c2" xml:space="preserve">npm test</text>
<text x="34" y="138" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">Do you want to proceed?</text>
<text x="34" y="162" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">❯ 1. Yes</text>
<text x="34" y="186" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">  2. Yes, and don’t ask again for: npm test</text>
<text x="34" y="210" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">  3. Yes, and switch to auto mode</text>
<text x="34" y="234" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">  4. No</text>
<text x="34" y="258" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#afb6c2" xml:space="preserve">Esc to cancel · Tab to amend</text>
<text x="20" y="40" font-size="13" font-weight="600" fill="#8b949e" text-anchor="start">On your screen</text>
<text x="20" y="56" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">the agent waits on you</text>
<text x="470" y="40" font-size="13" font-weight="600" fill="#8b949e" text-anchor="start">On the keypad</text>
<text x="470" y="56" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">the same choices, one key each</text>
<rect x="470" y="64" width="70" height="70" rx="8" fill="#24282d"/>
<rect x="470" y="64" width="70" height="6" rx="3" fill="#ff8080"/>
<text x="505.0" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">6 dark</text>
<text x="505.0" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">mode</text>
<text x="505.0" y="122" text-anchor="middle" font-size="9.5" fill="#ff8080">npm test</text>
<rect x="548" y="64" width="70" height="70" rx="8" fill="#24282d"/>
<rect x="548" y="64" width="70" height="6" rx="3" fill="#99ffe4"/>
<text x="583.0" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">1 Yes</text>
<text x="583.0" y="122" text-anchor="middle" font-size="9.5" fill="#99ffe4">6 dark mode</text>
<rect x="626" y="64" width="70" height="70" rx="8" fill="#24282d"/>
<rect x="626" y="64" width="70" height="6" rx="3" fill="#99ffe4"/>
<text x="661.0" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">2 Always</text>
<text x="661.0" y="122" text-anchor="middle" font-size="9.5" fill="#99ffe4">6 dark mode</text>
<rect x="470" y="142" width="70" height="70" rx="8" fill="#24282d"/>
<rect x="470" y="142" width="70" height="6" rx="3" fill="#afb6c2"/>
<text x="505.0" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">3 Auto</text>
<text x="505.0" y="173" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">mode</text>
<text x="505.0" y="200" text-anchor="middle" font-size="9.5" fill="#afb6c2">6 dark mode</text>
<rect x="548" y="142" width="70" height="70" rx="8" fill="#24282d"/>
<rect x="548" y="142" width="70" height="6" rx="3" fill="#ff8080"/>
<text x="583.0" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">4 No</text>
<text x="583.0" y="200" text-anchor="middle" font-size="9.5" fill="#ff8080">6 dark mode</text>
<rect x="626" y="142" width="70" height="70" rx="8" fill="#24282d"/>
<rect x="626" y="142" width="70" height="6" rx="3" fill="#afb6c2"/>
<text x="661.0" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">answer on</text>
<text x="661.0" y="179" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">screen</text>
<rect x="470" y="220" width="70" height="70" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="548" y="220" width="70" height="70" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="626" y="220" width="70" height="70" rx="8" fill="#24282d"/>
<rect x="626" y="220" width="70" height="6" rx="3" fill="#5c5c5c"/>
<text x="661.0" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">terug</text>
<text x="661.0" y="278" text-anchor="middle" font-size="9.5" fill="#5c5c5c">project A</text>
<line x1="412" y1="177.0" x2="458" y2="177.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="746" y="40" font-size="13" font-weight="600" fill="#8b949e" text-anchor="start">A question it cannot read</text>
<text x="746" y="56" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">answer it on screen</text>
<rect x="746" y="64" width="70" height="70" rx="8" fill="#24282d"/>
<rect x="746" y="64" width="70" height="6" rx="3" fill="#ff8080"/>
<text x="781.0" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">6 dark</text>
<text x="781.0" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">mode</text>
<text x="781.0" y="122" text-anchor="middle" font-size="9.5" fill="#ff8080">asks you</text>
<rect x="824" y="64" width="70" height="70" rx="8" fill="#24282d"/>
<rect x="824" y="64" width="70" height="6" rx="3" fill="#afb6c2"/>
<text x="859.0" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">answer on</text>
<text x="859.0" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">screen</text>
<text x="859.0" y="110" text-anchor="middle" font-size="9.5" fill="#afb6c2">no choices</text>
<text x="859.0" y="122" text-anchor="middle" font-size="9.5" fill="#afb6c2">found</text>
<rect x="902" y="64" width="70" height="70" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="746" y="142" width="70" height="70" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="824" y="142" width="70" height="70" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="902" y="142" width="70" height="70" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="746" y="220" width="70" height="70" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="824" y="220" width="70" height="70" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="902" y="220" width="70" height="70" rx="8" fill="#24282d"/>
<rect x="902" y="220" width="70" height="6" rx="3" fill="#5c5c5c"/>
<text x="937.0" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#ebf0ec">terug</text>
<text x="937.0" y="278" text-anchor="middle" font-size="9.5" fill="#5c5c5c">project A</text>
<text x="20" y="320" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Each key sends its own choice: the number the screen shows, or the arrow keys and Enter when the choices have no numbers.</text>
<text x="20" y="335" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Just before sending, helm reads the question again and sends nothing if it changed; the key then reads changed.</text>
</svg>
