<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1028 368" width="1028" height="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Answering a question</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<rect x="20" y="64" width="380" height="244" rx="8" fill="#16181c"/>
<text x="34" y="90" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">Bash command</text>
<text x="34" y="116" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#afb6c2" xml:space="preserve">npm test</text>
<text x="34" y="142" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">Do you want to proceed?</text>
<text x="34" y="168" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">❯ 1. Yes</text>
<text x="34" y="194" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">  2. Yes, and don’t ask again for: npm test</text>
<text x="34" y="220" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">  3. Yes, and switch to auto mode</text>
<text x="34" y="246" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ebf0ec" xml:space="preserve">  4. No</text>
<text x="34" y="272" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#afb6c2" xml:space="preserve">Esc to cancel · Tab to amend</text>
<text x="20" y="40" font-size="13" font-weight="600" fill="#8b949e" text-anchor="start">On your screen</text>
<text x="20" y="56" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">the agent waits on you</text>
<text x="470" y="40" font-size="13" font-weight="600" fill="#8b949e" text-anchor="start">On the keypad</text>
<text x="470" y="56" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">the same choices, one key each</text>
<rect x="470" y="64" width="76" height="76" rx="10" fill="#2b2d30"/>
<g transform="translate(495.0 78.0) scale(1.0833333333333333)" fill="none" stroke="#ff8080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9h8"/><path d="M8 13h6"/><path d="M14 18h-1l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v4.5"/><path d="M19 22v.01"/><path d="M19 19a2.003 2.003 0 0 0 .914 -3.782a1.98 1.98 0 0 0 -2.414 .483"/></g>
<text x="508.0" y="117" text-anchor="middle" font-size="9.5" fill="#ebf0ec">6 dark mode ·</text>
<text x="508.0" y="128" text-anchor="middle" font-size="9.5" fill="#ebf0ec">npm test</text>
<rect x="554" y="64" width="76" height="76" rx="10" fill="#2b2d30"/>
<g transform="translate(579.0 78.0) scale(1.0833333333333333)" fill="none" stroke="#99ffe4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l10 -10"/></g>
<text x="592.0" y="117" text-anchor="middle" font-size="9.5" fill="#ebf0ec">1 Yes · 6 dark</text>
<text x="592.0" y="128" text-anchor="middle" font-size="9.5" fill="#ebf0ec">mode</text>
<rect x="638" y="64" width="76" height="76" rx="10" fill="#2b2d30"/>
<g transform="translate(663.0 78.0) scale(1.0833333333333333)" fill="none" stroke="#99ffe4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12l5 5l10 -10"/><path d="M2 12l5 5m5 -5l5 -5"/></g>
<text x="676.0" y="117" text-anchor="middle" font-size="9.5" fill="#ebf0ec">2 Always · 6</text>
<text x="676.0" y="128" text-anchor="middle" font-size="9.5" fill="#ebf0ec">dark mode</text>
<rect x="470" y="148" width="76" height="76" rx="10" fill="#2b2d30"/>
<g transform="translate(495.0 162.0) scale(1.0833333333333333)" fill="none" stroke="#afb6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/></g>
<text x="508.0" y="201" text-anchor="middle" font-size="9.5" fill="#ebf0ec">3 Auto mode ·</text>
<text x="508.0" y="212" text-anchor="middle" font-size="9.5" fill="#ebf0ec">6 dark mode</text>
<rect x="554" y="148" width="76" height="76" rx="10" fill="#2b2d30"/>
<g transform="translate(579.0 162.0) scale(1.0833333333333333)" fill="none" stroke="#ff8080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></g>
<text x="592.0" y="201" text-anchor="middle" font-size="9.5" fill="#ebf0ec">4 No · 6 dark</text>
<text x="592.0" y="212" text-anchor="middle" font-size="9.5" fill="#ebf0ec">mode</text>
<rect x="638" y="148" width="76" height="76" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="470" y="232" width="76" height="76" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="554" y="232" width="76" height="76" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="638" y="232" width="76" height="76" rx="10" fill="#2b2d30"/>
<g transform="translate(663.0 246.0) scale(1.0833333333333333)" fill="none" stroke="#afb6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4 -4l4 -4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></g>
<text x="676.0" y="296" text-anchor="middle" font-size="9.5" fill="#ebf0ec">back</text>
<line x1="412" y1="186.0" x2="458" y2="186.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="764" y="40" font-size="13" font-weight="600" fill="#8b949e" text-anchor="start">A question it cannot read</text>
<text x="764" y="56" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">answer it on screen</text>
<rect x="764" y="64" width="76" height="76" rx="10" fill="#2b2d30"/>
<g transform="translate(789.0 78.0) scale(1.0833333333333333)" fill="none" stroke="#ff8080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9h8"/><path d="M8 13h6"/><path d="M14 18h-1l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v4.5"/><path d="M19 22v.01"/><path d="M19 19a2.003 2.003 0 0 0 .914 -3.782a1.98 1.98 0 0 0 -2.414 .483"/></g>
<text x="802.0" y="128" text-anchor="middle" font-size="9.5" fill="#ebf0ec">6 dark mode</text>
<rect x="848" y="64" width="76" height="76" rx="10" fill="#2b2d30"/>
<g transform="translate(873.0 78.0) scale(1.0833333333333333)" fill="none" stroke="#afb6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10z"/><path d="M7 20h10"/><path d="M9 16v4"/><path d="M15 16v4"/></g>
<text x="886.0" y="117" text-anchor="middle" font-size="9.5" fill="#ebf0ec">answer on</text>
<text x="886.0" y="128" text-anchor="middle" font-size="9.5" fill="#ebf0ec">screen</text>
<rect x="932" y="64" width="76" height="76" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="764" y="148" width="76" height="76" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="848" y="148" width="76" height="76" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="932" y="148" width="76" height="76" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="764" y="232" width="76" height="76" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="848" y="232" width="76" height="76" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="932" y="232" width="76" height="76" rx="10" fill="#2b2d30"/>
<g transform="translate(957.0 246.0) scale(1.0833333333333333)" fill="none" stroke="#afb6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4 -4l4 -4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></g>
<text x="970.0" y="296" text-anchor="middle" font-size="9.5" fill="#ebf0ec">back</text>
<text x="20" y="338" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Each key sends its own choice: the number the screen shows, or the arrow keys and Enter when the choices have no numbers.</text>
<text x="20" y="353" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">Just before sending, helm reads the question again and sends nothing if it changed; the key then reads changed.</text>
</svg>
